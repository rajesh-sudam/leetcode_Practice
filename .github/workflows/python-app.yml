
name: Python LeetCode Practice

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Check Python syntax and undefined names
        run: |
          python -m flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Check code style
        run: |
          python -m flake8 . \
            --count \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics \
            --exit-zero

      - name: Run pytest
        shell: bash
        run: |
          if find . -type f -name 'test_*.py' \
              -not -path './.git/*' | grep -q .; then
            python -m pytest -v
          else
            echo "No pytest test files found. Skipping tests."
            echo "Add test_*.py files when you are ready to test solutions."
          fi
